pipeline:
  name: IACM_infra
  identifier: IACM_infra
  projectIdentifier: SFTY_Training
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Provision
        identifier: Provision
        description: ""
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: AWSInfra
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
              - parallel:
                  - stepGroup:
                      name: apply
                      identifier: apply
                      steps:
                        - step:
                            type: IACMApproval
                            name: IACMApproval_1
                            identifier: IACMApproval_1
                            spec:
                              autoApprove: false
                            timeout: 1h
                            when:
                              stageStatus: Success
                              condition: |
                                <+pipeline.variables.terraforminput> == "apply"
                        - step:
                            type: IACMTerraformPlugin
                            name: IACMTerraformPlugin_3
                            identifier: IACMTerraformPlugin_3
                            spec:
                              command: apply
                            timeout: 1h
                      when:
                        stageStatus: Success
                        condition: <+pipeline.variables.terraforminput> == "apply"
                  - stepGroup:
                      name: destroy
                      identifier: destroy
                      steps:
                        - step:
                            type: IACMApproval
                            name: IACMApproval_2
                            identifier: IACMApproval_2
                            spec:
                              autoApprove: false
                            timeout: 1h
                            when:
                              stageStatus: Success
                              condition: |
                                <+pipeline.variables.terraforminput> == "destroy"
                        - step:
                            type: IACMTerraformPlugin
                            name: IACMTerraformPlugin_4
                            identifier: IACMTerraformPlugin_4
                            spec:
                              command: destroy
                            timeout: 1h
                        - step:
                            type: Run
                            name: Run_1
                            identifier: Run_1
                            spec: {}
                      when:
                        stageStatus: Success
                        condition: <+pipeline.variables.terraforminput> == "destroy"
        tags: {}
        when:
          pipelineStatus: Success
  variables:
    - name: terraforminput
      type: String
      description: apply
      required: true
      value: <+input>
