pipeline:
  name: IACM_infra
  identifier: IACM_infra
  projectIdentifier: SFTY_Training
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Provision
        identifier: Provision
        description: ""
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: AWSInfra
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
              - step:
                  type: IACMTerraformPlugin
                  name: apply
                  identifier: apply
                  timeout: 10m
                  spec:
                    command: apply
              - parallel:
                  - stepGroup:
                      name: apply
                      identifier: apply
                      steps: []
                      when:
                        stageStatus: Success
                        condition: <+pipeline.pipeline.variables.terraforminput> == "apply"
                  - stepGroup:
                      name: destroy
                      identifier: destroy
                      steps: []
                      when:
                        stageStatus: Success
                        condition: <+pipeline.pipeline.variables.terraforminput> == "destroy"
        tags: {}
        when:
          pipelineStatus: Success
  variables:
    - name: terraforminput
      type: String
      description: ""
      required: true
      value: <+input>
